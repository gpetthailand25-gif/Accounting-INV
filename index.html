<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ยืนยันบิลขายที่รับคืนจาก DC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e1e4ea;--pr:#2457d6;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#b91c1c;--erb:#fee2e2;--in:#1d4ed8;--inb:#dbeafe;--gr:#475569;--grb:#e2e8f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#98a1b5;--bd:#2c3342;--pr:#6b95ff;--ok:#4ade80;--okb:#14351f;--wn:#fbbf24;--wnb:#3a2c0b;--er:#f87171;--erb:#3d1818;--in:#93b4ff;--inb:#1c2b52;--gr:#cbd5e1;--grb:#2c3342}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#98a1b5;--bd:#2c3342;--pr:#6b95ff;--ok:#4ade80;--okb:#14351f;--wn:#fbbf24;--wnb:#3a2c0b;--er:#f87171;--erb:#3d1818;--in:#93b4ff;--inb:#1c2b52;--gr:#cbd5e1;--grb:#2c3342}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
h1{font-size:20px;margin:0}
.role{display:flex;background:var(--grb);border-radius:10px;padding:3px}
.role button{border:0;background:none;color:var(--tx);padding:7px 14px;border-radius:8px;font:inherit;cursor:pointer}
.role button.on{background:var(--pr);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px;cursor:pointer}
.stat.on{outline:2px solid var(--pr)}
.stat b{display:block;font-size:22px}.stat span{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button.b{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--pr);color:#fff}
button.b.ok{background:var(--ok);color:#fff}button.b.er{background:var(--er);color:#fff}
button.b.gh{background:var(--grb);color:var(--tx)}
@media (prefers-color-scheme:dark){button.b.ok,button.b.er{color:#111}}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.bar input{flex:1;min-width:150px}.bar select{width:auto;max-width:240px;flex:1;min-width:150px}
.bill{display:grid;grid-template-columns:1fr auto;gap:8px}
.no{font-weight:700}.mu{color:var(--mu);font-size:13px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500}
.s-opened{background:var(--grb);color:var(--gr)}.s-returned{background:var(--wnb);color:var(--wn)}
.s-confirmed{background:var(--okb);color:var(--ok)}.s-rejected{background:var(--erb);color:var(--er)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.note{background:var(--erb);color:var(--er);border-radius:8px;padding:6px 10px;margin-top:8px;font-size:13px}
details{margin-top:8px;font-size:13px;color:var(--mu)}
.empty{text-align:center;color:var(--mu);padding:30px}
.warn{background:var(--wnb);color:var(--wn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.amt{text-align:right;font-weight:700}
.wrap{max-width:1300px}
:root{--yl:#fff3a3}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--yl:#5a4a0a}}:root[data-theme="dark"]{--yl:#5a4a0a}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1150px;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mu);background:var(--bg);position:sticky;top:0}
.r{text-align:right}.c{text-align:center}
th.y,td.y{background:var(--yl);color:var(--tx)}th.y2,td.y2{background:var(--inb);color:var(--tx)}
td input[type=checkbox]{width:20px;height:20px;cursor:pointer}td input[type=date]{padding:4px 6px;width:140px}
td .note{margin-top:4px}td .b{padding:5px 10px;font-size:13px}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
<header>
  <h1>📄 ยืนยันบิลขายที่รับคืนจาก DC</h1>
  <div class="role" id="role"></div>
</header>
<div id="warn"></div>
<div class="stats" id="stats"></div>
<div id="formBox"></div>
<div class="bar">
  <input id="q" placeholder="ค้นหา เลขที่บิล / ลูกค้า / DC">
  <input id="fpo" placeholder="ค้นหาเลขที่ PO">
  <select id="fcu"></select>
  <select id="fst"><option value="all">ทุกสถานะ</option><option value="opened">รอรับคืน</option><option value="returned">รอบัญชียืนยัน</option><option value="rejected">ส่งกลับแก้ไข</option><option value="confirmed">ยืนยันแล้ว</option></select>
  <button class="b gh" id="clr">ล้างตัวกรอง</button>
  <button class="b gh" id="csv">⬇ ส่งออก CSV</button>
  <button class="b er" id="wipe">🗑 ล้างข้อมูลทั้งหมด</button>
</div>
<div id="list"></div>
</div>
<script>
const ST={opened:'เปิดบิลแล้ว (รอรับคืนจาก DC)',returned:'รอบัญชียืนยัน',confirmed:'บัญชียืนยันแล้ว',rejected:'บัญชีส่งกลับแก้ไข'};
const S={bills:[],role:'sales',filter:'all',q:'',po:'',cu:'',sd:1};
try{const r=localStorage.getItem('bc_role');if(r==='sales'||r==='acct')S.role=r}catch(e){}
let col=null,downloads=null;
const LK='bc_bills_v1';
function persist(){if(col)return;try{localStorage.setItem(LK,JSON.stringify(S.bills))}catch(e){}}
function loadLocal(){try{S.bills=JSON.parse(localStorage.getItem(LK)||'[]')}catch(e){S.bills=[]}render()}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const now=()=>new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
const rl=r=>r==='sales'?'ฝ่ายขาย':'ฝ่ายบัญชี';

async function save(b){
  b.updated=Date.now();
  const i=S.bills.findIndex(x=>x.id===b.id);
  if(i<0)S.bills.push(b);else S.bills[i]=b;
  render();
  if(col){try{await col.doc(b.id).set(JSON.parse(JSON.stringify(b)))}catch(e){alert('บันทึกไม่สำเร็จ: '+(e.message||e.code))}}else persist();
}
function log(b,act,note){(b.history=b.history||[]).push({t:now(),who:rl(S.role),act,note:note||''})}

function add(){
  const no=$('f_no').value.trim(),cu=$('f_cu').value.trim(),am=parseFloat($('f_am').value);
  if(!no||!cu||!(am>=0)){alert('กรอกเลขที่บิล ลูกค้า และยอดเงินให้ครบ');return}
  if(S.bills.some(b=>b.no===no)){alert('เลขที่บิลนี้มีอยู่แล้ว');return}
  const b={id:'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),no,customer:cu,amount:am,dc:$('f_dc').value.trim(),openDate:$('f_dt').value||today(),status:'opened',history:[]};
  log(b,'เปิดบิล');save(b);
  ['f_no','f_cu','f_am','f_dc'].forEach(i=>$(i).value='');
}
function act(id,a){
  const b=S.bills.find(x=>x.id===id);if(!b)return;
  if(a==='return'){const d=prompt('วันที่รับบิลคืนจาก DC (ปปปป-ดด-วว)',today());if(!d)return;const n=prompt('หมายเหตุ (ถ้ามี)','')||'';b.status='returned';b.returnDate=d;b.rejectReason='';log(b,'รับบิลคืนจาก DC ส่งให้บัญชี','วันที่ '+d+(n?' · '+n:''))}
  if(a==='resubmit'){b.status='returned';if(!b.accDate)b.accDate=b.recvDate||today();log(b,'แก้ไขแล้วส่งให้บัญชีอีกครั้ง')}
  if(a==='reopen'){const r=prompt('เหตุผลที่ขอบิลกลับ / ยกเลิกการยืนยัน');if(!r)return;b.status='rejected';b.rejectReason='ยกเลิกการยืนยัน: '+r;log(b,'ยกเลิกการยืนยัน (ขอบิลกลับ)',r)}
  if(a==='confirm'){if(!confirm('ยืนยันบิล '+b.no+' ?'))return;b.status='confirmed';b.rejectReason='';log(b,'ยืนยันบิล')}
  if(a==='reject'){const r=prompt('เหตุผลที่ส่งกลับ');if(!r)return;b.status='rejected';b.rejectReason=r;log(b,'ส่งกลับแก้ไข',r)}
  if(a==='del'){if(!confirm('ลบบิล '+b.no+' ?'))return;S.bills=S.bills.filter(x=>x.id!==id);render();if(col)col.doc(id).delete().catch(()=>{});else persist();return}
  save(b);
}

const SS={opened:'รอรับคืน',returned:'รอบัญชียืนยัน',confirmed:'ยืนยันแล้ว',rejected:'ส่งกลับแก้ไข'};
function rowHtml(b){
  const sales=S.role==='sales',lk=(!sales||b.status==='confirmed')?' disabled':'';
  let a='';
  if(sales&&b.status==='rejected')a=`<button class="b" data-a="resubmit" data-id="${b.id}">ส่งบัญชีอีกครั้ง</button>`;
  if(sales&&b.status==='opened')a=`<button class="b gh" data-a="del" data-id="${b.id}" title="ลบ">✕</button>`;
  if(!sales&&b.status==='confirmed')a=`<button class="b gh" data-a="reopen" data-id="${b.id}">↩ ยกเลิกยืนยัน (ขอบิลกลับ)</button>`;
  if(!sales&&b.status==='returned')a=`<button class="b ok" data-a="confirm" data-id="${b.id}">✓ ยืนยัน</button> <button class="b er" data-a="reject" data-id="${b.id}">ส่งกลับ</button>`;
  const hist=(b.history||[]).map(h=>h.t+' · '+h.who+' · '+h.act+' '+h.note).join('&#10;');
  return `<tr><td class="no" title="${esc(hist)}">${esc(b.no)}</td><td>${esc(b.openDate)}</td><td>${esc(b.po||'-')}</td><td>${esc(b.customer)}${b.status==='rejected'&&b.rejectReason?`<div class="note">ส่งกลับ: ${esc(b.rejectReason)}</div>`:''}</td><td class="r">${fmt(b.total??b.amount)}</td>
  <td class="y c"><input type="checkbox" data-k="gotInv" data-id="${b.id}"${b.gotInv?' checked':''}${lk}></td>
  <td><input type="date" data-k="recvDate" data-id="${b.id}" value="${esc(b.recvDate||'')}"${lk}></td>
  <td><input type="date" data-k="accDate" data-id="${b.id}" value="${esc(b.accDate||'')}"${(!sales&&(b.status==='returned'||b.status==='confirmed'))?'':' disabled'}></td>
  <td><span class="tag s-${b.status}">${SS[b.status]}</span></td><td>${a}</td></tr>`;
}
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
  const b=S.bills.find(x=>x.id===t.dataset.id);if(!b)return;
  if(k==='accDate'){if(S.role!=='acct')return;b.accDate=t.value;log(b,'แก้ไขวันที่บัญชีได้รับเอกสาร',t.value||'-');save(b);return}
  if(b.status==='confirmed'||S.role!=='sales')return;
  if(k==='recvDate')b.recvDate=t.value;else{b[k]=t.checked;if(t.checked&&!b.recvDate)b.recvDate=today()}
  if(b.status==='opened'||b.status==='returned'){
    const ns=(b.gotInv&&b.recvDate)?'returned':'opened';
    if(ns!==b.status){b.status=ns;if(ns==='returned'){if(!b.accDate)b.accDate=b.recvDate}else b.accDate='';log(b,ns==='returned'?'ได้รับ Invoice ส่งให้บัญชี':'ยกเลิกการส่งให้บัญชี','วันที่ '+(b.recvDate||'-'))}
  }
  save(b);
});
function render(){
  $('fst').value=S.filter;
  const cs=[...new Set(S.bills.map(b=>b.customer))].sort((a,b)=>String(a).localeCompare(String(b),'th'));
  $('fcu').innerHTML='<option value="">ลูกค้าทั้งหมด</option>'+cs.map(c=>`<option value="${esc(c)}"${c===S.cu?' selected':''}>${esc(c)}</option>`).join('');
  $('role').innerHTML=['sales','acct'].map(r=>`<button class="${S.role===r?'on':''}" data-r="${r}">${rl(r)}</button>`).join('');
  const cnt=k=>S.bills.filter(b=>k==='all'||b.status===k).length;
  const sum=k=>S.bills.filter(b=>b.status===k).reduce((a,b)=>a+Number(b.total??b.amount??0),0);
  $('stats').innerHTML=[['all','ทั้งหมด'],['opened','รอรับคืนจาก DC'],['returned','รอบัญชียืนยัน'],['rejected','ส่งกลับแก้ไข'],['confirmed','ยืนยันแล้ว']]
   .map(([k,l])=>`<div class="stat ${S.filter===k?'on':''}" data-f="${k}"><b>${cnt(k)}</b><span>${l}${k==='returned'||k==='confirmed'?' · ฿'+fmt(sum(k)):''}</span></div>`).join('');
  if(S.fb!==S.role){S.fb=S.role;$('formBox').innerHTML=S.role==='sales'?`<div class="card"><b>📥 อัพโหลดรายการ Invoice ประจำวัน (.xlsx)</b><div class="mu">คอลัมน์: เลขที่ · วันที่ · อ้างอิงPO · ลูกค้า · มูลค่าสินค้า · VAT. · รวมทั้งสิ้น — เลขที่ที่มีอยู่แล้วจะถูกข้าม ไม่ทับสถานะเดิม</div><div class="acts"><input type="file" id="file" accept=".xlsx,.xls,.csv" style="max-width:340px"></div><div id="prog" class="mu"></div></div><div class="card"><div class="form">
   <div><label>เลขที่บิล *</label><input id="f_no"></div><div><label>ลูกค้า *</label><input id="f_cu"></div>
   <div><label>ยอดเงิน (บาท) *</label><input id="f_am" type="number" step="0.01" min="0"></div>
   <div><label>DC / คลังสินค้า</label><input id="f_dc"></div><div><label>วันที่เปิดบิล</label><input id="f_dt" type="date" value="${today()}"></div>
   <div><button class="b" id="add">+ เปิดบิลใหม่</button></div></div></div>`:'';}
  const q=S.q.toLowerCase();
  const rows=S.bills.filter(b=>(S.filter==='all'||b.status===S.filter)&&(!S.po||String(b.po||'').toLowerCase().includes(S.po.toLowerCase()))&&(!S.cu||b.customer===S.cu)&&(!q||[b.no,b.customer,b.dc,b.po].join(' ').toLowerCase().includes(q))).sort((a,b)=>S.sd*String(a.no).localeCompare(String(b.no),'en',{numeric:true}));
  const all=rows.length;rows.length=Math.min(all,150);
  $('list').innerHTML=(all>150?`<div class="warn">แสดง 150 จาก ${all} รายการ — ใช้ค้นหาหรือกรองสถานะเพื่อดูที่เหลือ</div>`:'')+(rows.length?`<div class="tw"><table><thead><tr><th data-sort="1" style="cursor:pointer" title="คลิกเพื่อสลับการเรียง">เลขที่ ${S.sd>0?'▲':'▼'}</th><th>วันที่</th><th>PO</th><th>ลูกค้า</th><th class="r">รวมทั้งสิ้น</th><th class="y c">ได้รับ Invoice</th><th>วันที่ส่งเอกสารบัญชี</th><th>วันที่บัญชีได้รับเอกสาร</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows.map(rowHtml).join('')}</tbody></table></div>`:'<div class="empty">ไม่มีรายการบิล</div>');
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-r],[data-f],[data-a],[data-sort],#add,#csv,#clr,#wipe');if(!t)return;
  if(t.dataset.r){S.role=t.dataset.r;try{localStorage.setItem('bc_role',S.role)}catch(x){}render()}
  else if(t.dataset.f){S.filter=t.dataset.f;render()}
  else if(t.dataset.sort){S.sd*=-1;render()}
  else if(t.dataset.a)act(t.dataset.id,t.dataset.a);
  else if(t.id==='add')add();
  else if(t.id==='csv')exportCsv();
  else if(t.id==='wipe')wipeAll();
  else if(t.id==='clr'){S.q=S.po=S.cu='';S.filter='all';$('q').value='';$('fpo').value='';render()}
});
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('fpo').addEventListener('input',e=>{S.po=e.target.value.trim();render()});
$('fcu').addEventListener('change',e=>{S.cu=e.target.value;render()});
$('fst').addEventListener('change',e=>{S.filter=e.target.value;render()});

function toIso(v){
  let y,m,d;
  if(typeof v==='number'){const t=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);y=t.getUTCFullYear();m=t.getUTCMonth()+1;d=t.getUTCDate()}
  else{const p=String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!p)return null;d=+p[1];m=+p[2];y=+p[3]}
  if(y<100)y=y>=50?y+1957:2000+y;
  else if(y>=1950&&y<2000)y+=57; /* ปี พ.ศ. 2 หลักที่ Excel แปลงเป็น 19xx */
  else if(y>=2400)y-=543;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,''));return isFinite(n)?Math.round(n*100)/100:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function importFile(f){
  const P=$('prog');
  if(typeof XLSX==='undefined'){P.textContent='โหลดตัวอ่าน Excel ไม่สำเร็จ ลองรีเฟรชหน้า';return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    const hi=rows.findIndex(r=>r.some(c=>String(c).trim()==='เลขที่'));
    if(hi<0){P.textContent='ไม่พบหัวคอลัมน์ "เลขที่" ในไฟล์';return}
    const H=rows[hi].map(c=>String(c).replace(/\s/g,'').replace(/\.$/,''));
    const ix={no:H.indexOf('เลขที่'),dt:H.indexOf('วันที่'),po:H.indexOf('อ้างอิงPO'),cu:H.indexOf('ลูกค้า'),am:H.indexOf('มูลค่าสินค้า'),vat:H.indexOf('VAT'),tot:H.indexOf('รวมทั้งสิ้น')};
    const miss=Object.entries(ix).filter(([k,v])=>v<0).map(([k])=>k);
    if(miss.length){P.textContent='หัวคอลัมน์ไม่ครบ ขาด: '+miss.join(', ');return}
    const byNo=new Map(S.bills.map(b=>[b.no,b])),seen=new Set(),add=[],upd=[],chg=[];let dup=0,bad=0,same=0;
    const LB={customer:'ชื่อลูกค้า',po:'PO',amount:'มูลค่า',vat:'VAT',total:'รวม',openDate:'วันที่'};
    for(const r of rows.slice(hi+1)){
      const no=String(r[ix.no]??'').trim();if(!no)continue;
      const am=num(r[ix.am]),vat=num(r[ix.vat]),tot=num(r[ix.tot]),dt=toIso(r[ix.dt]);
      if(am==null||tot==null||!dt){bad++;continue}
      if(seen.has(no)){dup++;continue}
      seen.add(no);
      const n={po:String(r[ix.po]).trim(),customer:String(r[ix.cu]).replace(/\u00a0/g,' ').trim(),amount:am,vat,total:tot,openDate:dt};
      const old=byNo.get(no);
      if(old){
        const ch=Object.keys(n).filter(k=>String(old[k]??'')!==String(n[k]));
        if(!ch.length){same++;continue}
        const note=ch.map(k=>LB[k]+': '+(old[k]??'-')+' → '+n[k]).join('; ');
        upd.push({...old,...n,history:[...(old.history||[]),{t:now(),who:rl(S.role),act:'อัพเดตจากไฟล์',note}]});
        chg.push(no+' — '+note);
      }else add.push({id:no.replace(/[^A-Za-z0-9_\-.~:@+]/g,'_'),no,...n,dc:'',status:'opened',history:[{t:now(),who:rl(S.role),act:'นำเข้าจากไฟล์',note:f.name}]});
    }
    if(!add.length&&!upd.length){P.textContent='ไม่มีรายการใหม่หรือข้อมูลที่เปลี่ยน (ไม่เปลี่ยน '+same+(bad?' · ข้อมูลไม่ถูกต้อง '+bad:'')+')';return}
    if(!confirm('รายการใหม่ '+add.length+' ใบ · อัพเดตข้อมูลที่เปลี่ยน '+upd.length+' ใบ · ไม่เปลี่ยน '+same+(bad?' · ข้อมูลไม่ถูกต้อง '+bad:'')+(upd.length?'\n\nตัวอย่างที่จะอัพเดต:\n'+chg.slice(0,5).join('\n')+(chg.length>5?'\n...':''):'')+'\n\n(สถานะ การติ๊ก และวันที่ส่งเอกสารของบิลเดิมจะไม่ถูกเปลี่ยน)\n\nดำเนินการเลยหรือไม่?')){P.textContent='ยกเลิกการนำเข้า';return}
    let ok=0,fail=0;
    const jobs=[...add,...upd];
    for(const b of jobs){
      b.updated=Date.now();
      if(!col){const i=S.bills.findIndex(x=>x.id===b.id);if(i<0)S.bills.push(b);else S.bills[i]=b;ok++;continue}
      let done=false;
      for(let k=0;k<4&&!done;k++){
        try{await col.doc(b.id).set(JSON.parse(JSON.stringify(b)));done=true;ok++}
        catch(e){if(e.code==='permission-denied'||e.code==='resource-exhausted'||e.code==='quota_exceeded'){P.textContent='เขียนฐานข้อมูลไม่ได้ ('+e.code+') นำเข้าได้ '+ok+' ใบ — ตรวจสอบ Firestore Rules';return}await sleep(500*(k+1))}
      }
      if(!done)fail++;
      if((ok+fail)%10===0)P.textContent='กำลังนำเข้า '+(ok+fail)+' / '+jobs.length+' ...';
    }
    P.textContent='✓ สำเร็จ '+ok+' ใบ (ใหม่ '+add.length+' · อัพเดต '+upd.length+') · ไม่เปลี่ยน '+same+(bad?' · ข้อมูลไม่ถูกต้อง '+bad:'')+(fail?' · ล้มเหลว '+fail+' (อัพโหลดไฟล์ซ้ำเพื่อลองใหม่)':'');
    persist();render();
  }catch(e){P.textContent='อ่านไฟล์ไม่สำเร็จ: '+(e.message||e)}
}

async function exportCsv(){
  const h=['เลขที่บิล','อ้างอิงPO','ลูกค้า','มูลค่าสินค้า','VAT','รวมทั้งสิ้น','DC','วันที่เปิดบิล','วันที่ส่งเอกสารบัญชี','วันที่บัญชีได้รับเอกสาร','สถานะ'];
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const csv='\ufeff'+[h,...S.bills.map(b=>[b.no,b.po||'',b.customer,b.amount,b.vat??'',b.total??b.amount,b.dc,b.openDate,b.recvDate||b.returnDate||'',b.accDate||'',ST[b.status]])].map(r=>r.map(c).join(',')).join('\n');
  if(!downloads){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='bills-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove();return}
  try{await downloads.save({filename:'bills-'+today()+'.csv',data:csv})}catch(e){}
}

  try{
    if(col){
      const fs=firebase.firestore(),snap=await col.get();let bt=fs.batch(),n=0;
      for(const d of snap.docs){bt.delete(d.ref);if(++n%400===0){await bt.commit();bt=fs.batch()}}
      await bt.commit();
    }else{S.bills=[];persist()}
    try{localStorage.removeItem(LK)}catch(e){}
    if(!col){render()}
    alert('ล้างข้อมูลเรียบร้อย');

}
