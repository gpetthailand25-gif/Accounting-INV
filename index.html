<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามบิลขายที่รับคืนจาก DC</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mu:#6b7385;--bd:#e1e4ea;--pr:#2457d6;--ok:#15803d;--er:#b91c1c;--erb:#fee2e2;--okb:#dcfce7;--wnb:#fef3c7;--wn:#b45309;--inb:#dbeafe;--in:#1d4ed8;--grb:#e2e8f0;--gr:#475569;--pub:#ede9fe;--pu:#6d28d9;--cyb:#cffafe;--cy:#0e7490}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--tx:#e8ebf2;--mu:#98a1b5;--bd:#2c3342;--pr:#6b95ff;--ok:#4ade80;--er:#f87171;--erb:#3d1818;--okb:#14351f;--wnb:#3a2c0b;--wn:#fbbf24;--inb:#1c2b52;--in:#93b4ff;--grb:#2c3342;--gr:#cbd5e1;--pub:#2e2352;--pu:#c4b5fd;--cyb:#12353d;--cy:#67e8f9}}
:root{padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif}
.wrap{max-width:1300px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.role{display:flex;background:var(--grb);border-radius:10px;padding:3px;flex-wrap:wrap}
.role button{border:0;background:none;color:var(--tx);padding:7px 14px;border-radius:8px;font:inherit;cursor:pointer}
.role button.on{background:var(--pr);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;cursor:pointer;position:relative}
.stat.on{outline:2px solid var(--pr)}
.stat b{display:block;font-size:22px;line-height:1.2}.stat span{color:var(--mu);font-size:12px;display:block}
.stat i{position:absolute;top:8px;right:8px;font-style:normal;font-size:11px;background:var(--pr);color:#fff;border-radius:99px;padding:0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
input{padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.bar #q{flex:1;min-width:160px}
button.b{border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;background:var(--pr);color:#fff}
button.b.ok{background:var(--ok)}button.b.er{background:var(--er)}button.b.gh{background:var(--grb);color:var(--tx)}
button.b:disabled{opacity:.4;cursor:not-allowed}
@media (prefers-color-scheme:dark){button.b.ok,button.b.er{color:#111}}
.ab{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:5;border-color:var(--pr)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:1050px;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mu);background:var(--bg)}
.r{text-align:right}.no{font-weight:700}
td input[type=checkbox],th input[type=checkbox]{width:20px;height:20px;cursor:pointer}
tr.g td{background:var(--cyb);color:var(--cy);font-weight:500}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.s0{background:var(--grb);color:var(--gr)}.s1{background:var(--inb);color:var(--in)}.s2{background:var(--wnb);color:var(--wn)}
.s3{background:var(--pub);color:var(--pu)}.s4{background:var(--cyb);color:var(--cy)}.s5{background:var(--okb);color:var(--ok)}.s6{background:var(--erb);color:var(--er)}
.note{background:var(--erb);color:var(--er);border-radius:8px;padding:4px 10px;margin-top:4px;font-size:13px}
.warn{background:var(--wnb);color:var(--wn);padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px}
.empty{text-align:center;color:var(--mu);padding:30px}
#ph{display:none}
@media print{header,#stats,.bar,#ab,#imp,#man,#warn{display:none!important}.np{display:none}#ph{display:block;margin-bottom:10px}body{background:#fff;color:#000}.tw{border:0}table{min-width:0}.tag{border:1px solid #999;background:none;color:#000}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
<header><h1>📄 ติดตามบิลขายที่รับคืนจาก DC</h1><div class="role" id="role"></div></header>
<div id="warn"></div>
<div class="stats" id="stats"></div>
<div class="card" id="imp"><b>📥 อัพโหลดรายการ Invoice (.xlsx)</b> <span class="mu">คอลัมน์: เลขที่ · วันที่ · อ้างอิงPO · ลูกค้า · มูลค่าสินค้า · VAT. · รวมทั้งสิ้น — เลขที่เดิมจะไม่ถูกเปลี่ยนสถานะ</span>
<div style="margin-top:8px"><input type="file" id="file" accept=".xlsx,.xls,.csv"> <button class="b gh" id="tpl">⬇ ดาวน์โหลดเท็มเพลต</button> <span class="mu" id="prog"></span></div></div>
<div class="card" id="man"><b>✍️ พิมพ์เพิ่มบิลเอง</b> <span class="mu">(กรณีไม่อัพโหลดไฟล์) — รวมทั้งสิ้นคำนวณให้อัตโนมัติ แก้ไขเองได้</span>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px">
<input id="m_no" placeholder="เลขที่บิล *">
<input id="m_dt" type="date" title="วันที่บิล *">
<input id="m_po" placeholder="อ้างอิง PO">
<input id="m_cu" placeholder="ลูกค้า *">
<input id="m_am" type="number" step="0.01" inputmode="decimal" placeholder="มูลค่าสินค้า *">
<input id="m_vat" type="number" step="0.01" inputmode="decimal" placeholder="VAT">
<input id="m_tot" type="number" step="0.01" inputmode="decimal" placeholder="รวมทั้งสิ้น *">
</div>
<div style="margin-top:8px"><button class="b ok" id="m_add">➕ เพิ่มบิล</button> <button class="b gh" id="m_vat7">คิด VAT 7%</button> <span class="mu" id="m_msg"></span></div></div>
<div class="bar">
  <input id="q" placeholder="ค้นหา เลขที่บิล / ลูกค้า / PO">
  <label class="mu">วันที่ดำเนินการ <input type="date" id="dt"></label>
  <button class="b gh" id="prt">🖨 พิมพ์รายการ</button>
  <button class="b gh" id="csv">⬇ CSV</button>
  <button class="b er" id="wipe" style="display:none">🗑 ล้างข้อมูลทั้งหมด</button>
</div>
<div id="ab"></div>
<div id="ph"></div>
<div id="list"></div>
</div>
<script>
const ROLES={a1:'แอดมิน 1 · รับบิล',a2:'แอดมิน 2 · ตรวจ/เรียง',acct:'บัญชี'};
const RS={a1:'แอดมิน 1',a2:'แอดมิน 2',acct:'บัญชี'};
/* สถานะ: [ชื่อ, สี] ตามลำดับขั้นตอน */
const ST={opened:['1 รอรับคืนจาก DC','s0'],received:['2 รับคืนแล้ว รอส่งแอดมิน 2','s1'],checking:['3 รอแอดมิน 2 ตรวจ','s2'],checked:['4 ตรวจ/เรียงแล้ว รอส่งบัญชี','s3'],sent:['5 รอบัญชียืนยัน','s4'],confirmed:['6 บัญชีรับแล้ว','s5'],issue:['⚠ ส่งกลับแก้ไข','s6']};
/* งานของแต่ละ role: from=สถานะต้นทาง to=สถานะปลายทาง date=ช่องวันที่ที่บันทึก */
const ACT={
 receive:{role:'a1',from:'opened',to:'received',date:'recvDate',label:'✓ ได้รับบิลคืนจาก DC',c:'ok'},
 hand:{role:'a1',from:'received',to:'checking',label:'ส่งให้แอดมิน 2 ตรวจ'},
 undo1:{role:'a1',from:'received',to:'opened',label:'↩ ยกเลิกการรับ',c:'gh'},
 resend:{role:'a1',from:'issue',to:'checking',label:'แก้ไขแล้ว ส่งแอดมิน 2 อีกครั้ง'},
 check:{role:'a2',from:'checking',to:'checked',date:'chkDate',label:'✓ ตรวจถูกต้อง (เรียงตามเลขที่บิลแล้ว)',c:'ok'},
 bad2:{role:'a2',from:'checking',to:'issue',why:1,label:'ส่งกลับแอดมิน 1',c:'er'},
 toAcc:{role:'a2',from:'checked',to:'sent',date:'sendDate',label:'ส่งบัญชี',batch:1},
 undo2:{role:'a2',from:'checked',to:'checking',label:'↩ กลับไปตรวจใหม่',c:'gh'},
 confirm:{role:'acct',from:'sent',to:'confirmed',date:'accDate',label:'✓ บัญชีรับบิลแล้ว',c:'ok'},
 bad3:{role:'acct',from:'sent',to:'issue',why:1,label:'ไม่ครบ / ส่งกลับ',c:'er'},
 reset:{role:'acct',from:'*',to:'opened',why:1,reset:1,label:'🔄 รีเซตบิลกลับเป็นเริ่มต้น',c:'gh'}
};
const MINE={a1:['opened','received','issue'],a2:['checking','checked'],acct:['sent']};
const S={bills:[],role:'a1',f:'opened',q:'',sd:1,sel:new Set()};
try{const r=localStorage.getItem('bc2_role');if(MINE[r])S.role=r}catch(e){}
const PW={a1:'AD1',a2:'SL1',acct:'WHO'};
const unlocked=r=>{try{return sessionStorage.getItem('bc2_u_'+r)==='1'}catch(e){return false}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=n=>Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const now=()=>new Date().toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'});
const log=(b,act,note)=>(b.history=b.history||[]).push({t:now(),who:RS[S.role],act,note:note||''});
const get=id=>S.bills.find(b=>b.id===id);
const acts=()=>Object.entries(ACT).filter(([k,a])=>a.role===S.role&&(a.from===S.f||(a.from==='*'&&S.f!=='opened')));
const first=r=>MINE[r].find(k=>S.bills.some(b=>b.status===k))||MINE[r][0];
S.f=MINE[S.role][0];
$('dt').value=today();

let col=null;const LK='bc2_bills';
const persist=()=>{if(!col)try{localStorage.setItem(LK,JSON.stringify(S.bills))}catch(e){}};
async function saveMany(a){
  a.forEach(b=>{b.updated=Date.now();const i=S.bills.findIndex(x=>x.id===b.id);i<0?S.bills.push(b):S.bills[i]=b});
  if(!col){persist();return}
  try{const fs=firebase.firestore();
    for(let i=0;i<a.length;i+=400){const bt=fs.batch();a.slice(i,i+400).forEach(b=>bt.set(col.doc(b.id),JSON.parse(JSON.stringify(b))));await bt.commit()}
  }catch(e){alert('บันทึกไม่สำเร็จ: '+(e.code||e.message))}
}
function setRole(r){S.role=r;S.sel.clear();S.f=first(r);try{localStorage.setItem('bc2_role',r)}catch(e){}render()}
function askPw(r0,must){
  const o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:'+(must?'var(--bg)':'rgba(0,0,0,.5)')+';display:flex;align-items:center;justify-content:center;z-index:50';
  o.innerHTML='<div class="card" style="width:min(320px,90vw);margin:0"><b>🔒 เข้าสู่ระบบ</b><div class="mu" style="margin:6px 0">เลือกบทบาทและใส่รหัสผ่าน</div><select id="pr" style="width:100%;margin-bottom:8px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit">'+Object.keys(ROLES).map(r=>`<option value="${r}"${r===r0?' selected':''}>${ROLES[r]}</option>`).join('')+'</select><input type="password" id="pw" style="width:100%"><div id="pwe" class="mu" style="color:var(--er);min-height:22px"></div><button class="b" id="pwok">เข้าสู่ระบบ</button>'+(must?'':' <button class="b gh" id="pwno">ยกเลิก</button>')+'</div>';
  document.body.appendChild(o);const i=o.querySelector('#pw');i.focus();
  const go=()=>{const r=o.querySelector('#pr').value;
    if(i.value.trim().toUpperCase()===PW[r]){try{sessionStorage.setItem('bc2_u_'+r,'1')}catch(e){}o.remove();setRole(r)}
    else{o.querySelector('#pwe').textContent='รหัสผ่านไม่ถูกต้อง';i.value='';i.focus()}};
  o.querySelector('#pwok').onclick=go;
  if(!must)o.querySelector('#pwno').onclick=()=>o.remove();
  i.onkeydown=e=>{if(e.key==='Enter')go();if(e.key==='Escape'&&!must)o.remove()};
}

async function run(k){
  const A=ACT[k],ids=[...S.sel].filter(id=>get(id)&&(A.from==='*'?get(id).status!=='opened':get(id).status===A.from));
  if(!ids.length)return;
  let why='';
  if(A.why){why=prompt(A.reset?'รีเซต '+ids.length+' ใบ กลับเป็น "รอรับคืนจาก DC" (ล้างวันที่และสถานะที่บันทึกไว้)\nระบุเหตุผล':'เหตุผล / เลขบิลที่ไม่ครบ หรือมีปัญหา');if(!why)return}
  else if(!confirm(A.label.replace(/^[✓↩ ]+/,'')+' จำนวน '+ids.length+' ใบ ?'))return;
  const d=$('dt').value||today(),bt='S'+d.replace(/-/g,'')+'-'+new Date().toTimeString().slice(0,5).replace(':','');
  const out=ids.map(id=>{
    const b={...get(id)};b.status=A.to;
    if(A.date)b[A.date]=d;
    if(A.reset)['recvDate','chkDate','sendDate','accDate','batch'].forEach(f=>delete b[f]);
    if(A.batch)b.batch=bt;
    b.reason=A.to==='issue'?why:'';
    log(b,A.label.replace(/^[✓↩ ]+/,''),(A.date?'วันที่ '+d:'')+(why?' '+why:''));
    return b;
  });
  S.sel.clear();await saveMany(out);
  const nx=MINE[S.role].includes(A.to);
  render();
}

function row(b,i,ok){
  const h=(b.history||[]).map(x=>x.t+' · '+x.who+' · '+x.act+' '+(x.note||'')).join('\n');
  return `<tr><td class="np">${ok?`<input type="checkbox" data-id="${esc(b.id)}"${S.sel.has(b.id)?' checked':''}>`:''}</td><td class="mu">${i}</td><td class="no" title="${esc(h)}">${esc(b.no)}</td><td>${esc(b.openDate)}</td><td>${esc(b.po||'-')}</td><td>${esc(b.customer)}${b.status==='issue'&&b.reason?`<div class="note">ส่งกลับ: ${esc(b.reason)}</div>`:''}</td><td class="r">${fmt(b.total??b.amount)}</td><td>${esc(b.recvDate||'')}</td><td>${esc(b.sendDate||'')}</td><td>${esc(b.accDate||'')}</td><td><span class="tag ${ST[b.status][1]}">${ST[b.status][0]}</span></td></tr>`;
}
let rowsNow=[];
function render(){
  S.sel=new Set([...S.sel].filter(id=>get(id)));
  const B=S.bills,cnt=k=>B.filter(b=>k==='all'||b.status===k).length,sum=k=>B.filter(b=>b.status===k).reduce((a,b)=>a+Number(b.total??b.amount??0),0);
  $('role').innerHTML=Object.keys(ROLES).map(r=>`<button class="${S.role===r?'on':''}" data-r="${r}">${ROLES[r]}</button>`).join('');
  $('stats').innerHTML=[['all','ทั้งหมด'],...Object.entries(ST).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<div class="stat ${S.f===k?'on':''}" data-f="${k}">${MINE[S.role].includes(k)&&cnt(k)?'<i>งานของคุณ</i>':''}<b>${cnt(k)}</b><span>${l}</span>${k==='sent'||k==='confirmed'?`<span>฿${fmt(sum(k))}</span>`:''}</div>`).join('');
  $('imp').style.display=S.role==='a1'?'':'none';$('man').style.display=S.role==='a1'?'':'none';
  $('wipe').style.display=S.role==='acct'?'':'none';
  const q=S.q.toLowerCase(),A=acts();
  const rows=B.filter(b=>(S.f==='all'||b.status===S.f)&&(!q||[b.no,b.customer,b.po].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(S.f==='sent'?String(a.batch||'').localeCompare(String(b.batch||'')):0)||S.sd*String(a.no).localeCompare(String(b.no),'en',{numeric:true}));
  const all=rows.length;rows.length=Math.min(all,300);rowsNow=rows;
  const vis=rows.filter(b=>A.length),selAll=vis.length&&vis.every(b=>S.sel.has(b.id));
  $('ab').innerHTML=A.length?`<div class="card ab"><b>เลือกแล้ว ${S.sel.size} ใบ</b>${A.map(([k,a])=>`<button class="b ${a.c||''}" data-do="${k}"${S.sel.size?'':' disabled'}>${a.label}</button>`).join('')}</div>`
    :`<div class="mu" style="margin-bottom:10px">${S.f==='all'?'ดูทุกสถานะ — เลือกการ์ดสถานะด้านบนเพื่อทำงาน':'สถานะนี้ไม่ใช่งานของ '+RS[S.role]+' (ดูอย่างเดียว)'}</div>`;
  let h='',i=0,lastB=null;
  for(const b of rows){
    if(S.f==='sent'&&b.batch!==lastB){lastB=b.batch;h+=`<tr class="g"><td colspan="11">ชุดส่งบัญชี ${esc(b.batch||'-')} · ${rows.filter(x=>x.batch===b.batch).length} ใบ</td></tr>`;i=0}
    h+=row(b,++i,A.length>0);
  }
  $('list').innerHTML=(all>300?`<div class="warn">แสดง 300 จาก ${all} รายการ — ใช้ค้นหาเพื่อดูที่เหลือ</div>`:'')+(rows.length?`<div class="tw"><table><thead><tr><th class="np">${A.length?`<input type="checkbox" id="sa"${selAll?' checked':''}>`:''}</th><th>#</th><th data-sort="1" style="cursor:pointer" title="สลับการเรียง">เลขที่บิล ${S.sd>0?'▲':'▼'}</th><th>วันที่บิล</th><th>PO</th><th>ลูกค้า</th><th class="r">รวมทั้งสิ้น</th><th>รับคืนจาก DC</th><th>ส่งบัญชี</th><th>บัญชีรับ</th><th>สถานะ</th></tr></thead><tbody>${h}</tbody></table></div>`:'<div class="empty">ไม่มีรายการในสถานะนี้</div>');
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-r],[data-f],[data-do],[data-sort],#csv,#prt,#sa,#wipe,#tpl,#m_add,#m_vat7');if(!t)return;
  if(t.dataset.r){const r=t.dataset.r;if(!unlocked(r)){askPw(r,false);return}setRole(r)}
  else if(t.dataset.f){S.f=t.dataset.f;S.sel.clear();render()}
  else if(t.dataset.do)run(t.dataset.do);
  else if(t.dataset.sort){S.sd*=-1;render()}
  else if(t.id==='sa'){const on=t.checked;rowsNow.forEach(b=>on?S.sel.add(b.id):S.sel.delete(b.id));render()}
  else if(t.id==='csv')exportCsv();
  else if(t.id==='tpl')dlTpl();
  else if(t.id==='m_add')addManual();
  else if(t.id==='m_vat7')calcVat();
  else if(t.id==='wipe')wipeAll();
  else if(t.id==='prt'){
    const tot=rowsNow.reduce((a,b)=>a+Number(b.total??b.amount??0),0);
    $('ph').innerHTML=`<h2 style="margin:0">รายการบิล — ${esc(S.f==='all'?'ทุกสถานะ':ST[S.f][0])}</h2><div>พิมพ์วันที่ ${now()} · ${rowsNow.length} ใบ · รวม ฿${fmt(tot)} · เรียงตามเลขที่บิล</div>`;
    window.print();
  }
});

function toIso(v){
  let y,m,d;
  if(typeof v==='number'){const t=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);y=t.getUTCFullYear();m=t.getUTCMonth()+1;d=t.getUTCDate()}
  else{const p=String(v||'').trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);if(!p)return null;d=+p[1];m=+p[2];y=+p[3]}
  if(y<100)y=y>=50?y+1957:2000+y;else if(y>=1950&&y<2000)y+=57;else if(y>=2400)y-=543;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
const num=v=>{const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,''));return isFinite(n)?Math.round(n*100)/100:null};
async function imp(f){
  const P=$('prog');
  if(typeof XLSX==='undefined'){P.textContent='โหลดตัวอ่าน Excel ไม่สำเร็จ ลองรีเฟรชหน้า';return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'}),R=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});
    const hi=R.findIndex(r=>r.some(c=>String(c).trim()==='เลขที่'));if(hi<0){P.textContent='ไม่พบหัวคอลัมน์ "เลขที่"';return}
    const H=R[hi].map(c=>String(c).replace(/\s/g,'').replace(/\.$/,'')),X=n=>H.indexOf(n);
    const ix={no:X('เลขที่'),dt:X('วันที่'),po:X('อ้างอิงPO'),cu:X('ลูกค้า'),am:X('มูลค่าสินค้า'),vat:X('VAT'),tot:X('รวมทั้งสิ้น')};
    if(Object.values(ix).some(v=>v<0)){P.textContent='หัวคอลัมน์ไม่ครบ';return}
    const by=new Map(S.bills.map(b=>[b.no,b])),out=[],seen=new Set();let nw=0,up=0,same=0,bad=0;
    for(const r of R.slice(hi+1)){
      const no=String(r[ix.no]??'').trim();if(!no||seen.has(no))continue;seen.add(no);
      const am=num(r[ix.am]),tot=num(r[ix.tot]),dt=toIso(r[ix.dt]);if(am==null||tot==null||!dt){bad++;continue}
      const n={po:String(r[ix.po]).trim(),customer:String(r[ix.cu]).replace(/\u00a0/g,' ').trim(),amount:am,vat:num(r[ix.vat]),total:tot,openDate:dt},o=by.get(no);
      if(o){if(Object.keys(n).every(k=>String(o[k]??'')===String(n[k]))){same++;continue}const b={...o,...n};log(b,'อัพเดตจากไฟล์',f.name);out.push(b);up++}
      else{const b={id:no.replace(/[^A-Za-z0-9_\-.~:@+]/g,'_'),no,...n,dc:'',status:'opened',history:[]};log(b,'นำเข้าจากไฟล์',f.name);out.push(b);nw++}
    }
    if(!out.length){P.textContent='ไม่มีรายการใหม่หรือที่เปลี่ยน (เหมือนเดิม '+same+(bad?' · ไม่ถูกต้อง '+bad:'')+')';return}
    if(!confirm('รายการใหม่ '+nw+' ใบ · อัพเดตข้อมูล '+up+' ใบ · เหมือนเดิม '+same+(bad?' · ไม่ถูกต้อง '+bad:'')+'\n(สถานะของบิลเดิมจะไม่ถูกเปลี่ยน)\n\nดำเนินการเลยหรือไม่?')){P.textContent='ยกเลิกการนำเข้า';return}
    P.textContent='กำลังบันทึก...';await saveMany(out);P.textContent='✓ นำเข้าแล้ว ใหม่ '+nw+' · อัพเดต '+up;render();
  }catch(e){P.textContent='อ่านไฟล์ไม่สำเร็จ: '+(e.message||e)}
}

async function addManual(){
  const M=$('m_msg'),no=mv('m_no').trim(),dt=mv('m_dt'),cu=mv('m_cu').trim(),am=num(mv('m_am')),tot=num(mv('m_tot'));
